<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Ivan Amoroso">
  <meta name="description" content="A simple Datepicker UI website made in HTML and CSS">
  <meta name="keywords" content="HTML, CSS, website, beginners">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css">
  <link rel="stylesheet" href="./styles/styles.css">
  <title>Datepicker UI</title>
</head>
<body>
  <div class="datepicker">
    <!-- Datepicker Input -->
    <div class="datepicker-input">
      <input type="text" placeholder="dd / mm / yyyy">
      <button class="datepicker-icon">
        <i class="ri-calendar-line"></i>
      </button>
    </div>

    <div class="calendar">
      <!-- Calendar Header -->
      <div class="calendar-header">
        <button class="previous-btn">
          <i class="ri-arrow-left-s-fill"></i>
        </button>
        <span class="month-year">November 2026</span>
        <button class="next-btn">
          <i class="ri-arrow-right-s-fill"></i>
        </button>
      </div>

      <!-- Calendar Body -->
      <div class="calendar-body">
        <div class="day-names">
          <span>S</span>
          <span>M</span>
          <span>T</span>
          <span>W</span>
          <span>T</span>
          <span>F</span>
          <span>S</span>
        </div>
        <div class="days">
          <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
          <span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span>
          <span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span>
          <span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span>
          <span>29</span><span>30</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
